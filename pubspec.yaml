name: media_player_app
description: Aplicativo completo de reprodução de áudio e vídeo com biblioteca local
# homepage: Gemini
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.2
  
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.11
  video_player: ^2.8.2
  audio_service: ^0.18.12
  
  metadata_god: ^0.5.2
  flutter_media_metadata: ^1.0.0
  
  permission_handler: ^11.3.0
  path_provider: ^2.1.2
  device_info_plus: ^9.1.1
  file_picker: ^6.1.1
  
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  
  provider: ^6.1.1
  rxdart: ^0.27.7
  
  flutter_slidable: ^3.0.1
  cached_network_image: ^3.3.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
